---
# canvas_step: manual_smoke_test
# intent: Run automated smoke tests against the deployed application to verify it is healthy
# systems: aws_ec2
- name: Run smoke tests against deployed application
  hosts: localhost
  gather_facts: false
  vars:
    test_checklist: "{{ test_checklist | mandatory }}"
  tasks:
    - name: Check application health endpoint
      ansible.builtin.uri:
        url: "{{ app_url }}/health"
        method: GET
        status_code: 200
        validate_certs: false
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200
      tags: [canvas_step_manual_smoke_test]

    - name: Report smoke test result
      ansible.builtin.debug:
        msg: "Smoke test passed. Health check status: {{ health_check.status }}"
      tags: [canvas_step_manual_smoke_test]
